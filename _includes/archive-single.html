<article class="archive__item" itemscope itemtype="https://schema.org/CreativeWork">
  <h2 class="archive__item-title" itemprop="headline">{{ post.title }}</h2>
  <p class="archive__item-venue">{{ post.venue }}</p>
  <p class="archive__item-citation">{{ post.citation }}</p>
  {% if post.codeurl %}
    <a class="btn btn--code" href="{{ post.codeurl }}" target="_blank" rel="noopener">Code</a>
  {% endif %}
</article>
